<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial;
    }
    .error-container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .error-container h1 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 48px;
    }
    .error-container p {
      color: #666;
      margin: 0;
    }
  </style>
</head>
<body>
  <script>
    // Get link_id from hash (e.g., #27c310d5)
    const hash = window.location.hash.slice(1);

    if (hash && hash.length > 5) {
      // Check if link exists before redirecting
      fetch(`https://mmworkbot-dev-production.up.railway.app/check-link/${hash}`)
        .then(response => {
          if (response.status === 404) {
            // Link is deleted - show 404
            document.body.innerHTML = `
              <div class="error-container">
                <h1>404</h1>
                <p>Ссылка больше не активна</p>
              </div>
            `;
            document.title = '404 Not Found';
          } else {
            // Link exists - redirect to login
            window.location.href = `./login.html?link_id=${hash}`;
          }
        })
        .catch(error => {
          // Network error - redirect anyway (safer fallback)
          console.error('Error checking link:', error);
          window.location.href = `./login.html?link_id=${hash}`;
        });
    } else {
      window.location.href = './login.html';
    }
  </script>
</body>
</html>
